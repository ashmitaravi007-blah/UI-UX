<html>
    <head>
        <title>Royal residency room booking website</title>
    </head>
    <body>
        <h1 style="background-color: rgb(214, 166, 11);"><i>Welcome to Royal residency!</i></h1>
        <center><img src="Hotel.webp" alt="Hotel" usemap="#Hotel" width="1000" height="500">
        <map name="Hotel">
            <area shape="rect" coords="34,44,270,350" alt="Hotel" href="https://www.google.com">
        <h3 style="background-color: rgb(214, 166, 11);"><figcaption><b><i>Relax, unwind, and enjoy the comfort you deserve</i></b></figcaption></h1>
        </center><br>
        <form>
            <h1><u>RESERVATION FORM</u></h1>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name"><br><br>
            <label for="gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="male">MALE
            <input type="radio" id="female" name="gender" value="female">FEMALE
            <br><br>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age"><br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br><br>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" cols="30"></textarea>
            <br><br>
            <label for="room" >Select Room:</label>
            <select id="room" name="rooms">
                <option value="deluxe room">Deluxe Room</option>
                <option value="junior suite">Junior Suite</option>
                <option value="luxury suite">Luxury Suite</option>
                <option value="executive room">Executive Room</option>
                <option value="presidential suite">Presidential Suite</option>
            </select>
            <br><br>
            <label for="facilities">Facilities:</label>
            <input type="checkbox" id="Swimming pool" name="hob"value="Swimming pool">SWIMMING POOL
            <input type="checkbox" id="Spa and wellness centre" name="hob"value="Spa and wellness centre">SPA AND WELLNESS CENTRE
            <input type="checkbox" id="Gym" name="hob"value="Gym">GYM 
            <input type="checkbox" id="Banquet and conference halls" name="hob"value="Banquet and conference halls">BANQUET AND CONFERENCE HALLS
            <br><br> 
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </body>
</html>
